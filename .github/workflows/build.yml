name: Build Arch package

on:
  push:
    branches: [original-gpu-unlock-only]
  workflow_dispatch:      # allow manual runs

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Install pacman deps
        run: |
          pacman -Syu --noconfirm git sudo

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: original-gpu-unlock-only

      - name: Build package
        run: |
          # makepkg refuses to run as root; create a build user
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder: .
          sudo -u builder makepkg -f --noconfirm  --nodeps

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omen-wmi-boost-dkms
          path: "*.pkg.tar.zst"